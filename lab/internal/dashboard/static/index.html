<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centavo: laboratório de caos</title>
  <link rel="stylesheet" href="app.css">
  <script src="messages.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>

  <header class="lab-bar">
    <p class="brand">Centavo</p>
    <p class="lab-notice" id="lab-notice"></p>
    <p class="mode" id="mode"></p>
  </header>

  <main id="main" tabindex="-1">
    <div class="rounds" id="rounds-view" aria-live="polite"></div>

    <section class="history" id="history" aria-labelledby="history-title">
      <h2 id="history-title"></h2>
      <div class="table-wrap">
        <table>
          <thead><tr id="history-head"></tr></thead>
          <tbody id="history-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <template id="round-template">
    <article class="round">
      <header class="round-head">
        <p class="round-id" data-field="round-id"></p>
        <h1 class="headline" data-field="headline"></h1>
        <p class="scenario" data-field="scenario"></p>
        <p class="expectation" data-field="expectation"></p>
      </header>

      <div class="player" data-field="player" hidden>
        <button type="button" data-field="play"></button>
        <label><span data-field="speed-label"></span>
          <select data-field="speed">
            <option value="1">1x</option>
            <option value="10" selected>10x</option>
            <option value="30">30x</option>
            <option value="60">60x</option>
          </select>
        </label>
        <span class="clock" data-field="clock"></span>
      </div>

      <section class="phases">
        <h2 class="visually-hidden" data-field="phases-title"></h2>
        <ol data-field="phases"></ol>
      </section>

      <section class="track">
        <h2 data-field="track-title"></h2>
        <div class="track-chart" data-field="track"></div>
        <ul class="legend" data-field="legend"></ul>
        <ol class="events" data-field="events"></ol>
      </section>

      <div class="state">
        <section class="money" data-field="money-section">
          <h2 data-field="money-title"></h2>
          <p class="money-detail" data-field="money-detail"></p>
          <dl data-field="money"></dl>
        </section>

        <section class="guarantees">
          <h2 data-field="guarantees-title"></h2>
          <ul data-field="guarantees"></ul>
        </section>
      </div>
    </article>
  </template>
</body>
</html>
