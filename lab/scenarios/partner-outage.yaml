name: partner-outage
description: O parceiro fica fora do ar por minutos, e às vezes processa antes de falhar.
duration: 20m
workload:
  profile: payments-heavy
  clients: 8
  rate_per_second: 20
  accounts: 32
  exclusive_accounts: true
  client_mix: {polite: 1.0}
faults:
  - id: outage
    kind: partner
    modes: {outage: {until: "+3m", mode: "503"}, error_after_process: 0.05}
