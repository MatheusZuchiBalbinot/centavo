name: webhook-chaos
description: Webhooks atrasados e fora de ordem, com devoluções depois da liquidação, e o sweeper parado com um status velho na mão (`sweeper.after_status_before_transition`).
duration: 15m
workload:
  profile: payments-heavy
  clients: 8
  rate_per_second: 20
  accounts: 32
  exclusive_accounts: true
  client_mix: {polite: 1.0}
faults:
  - id: reordering
    kind: partner
    modes: {webhook_delay_max: 5s, webhook_reorder_window: 5s, return_after_settle: 0.2}
  - id: stale-sweeper
    kind: failpoint
    targets: [bank-worker-1, bank-worker-2]
    failpoint: sweeper.after_status_before_transition
    action: delay
    arg: 20s
    probability: 0.2
