name: webhook-blackhole-out
description: Nenhum webhook chega ao banco e só há PIX de saída, que o sweeper completa consultando o parceiro (FC17, FC27, PM-009). O PIX de entrada sem webhook fica para a conciliação, no webhook-blackhole.
duration: 20m
workload:
  profile: payments-out
  clients: 8
  rate_per_second: 20
  accounts: 32
  exclusive_accounts: true
  client_mix: {polite: 1.0}
faults:
  - id: blackhole
    kind: partner
    modes: {webhook_drop: 1.0}
