name: clock-skew
description: Um worker com o relógio 29 s adiantado e a API dez minutos atrasada; leases, assinaturas e ordenação não podem depender do relógio de parede (FC35, FC37, FC38, FC39, PM-013).
duration: 15m
workload:
  profile: payments-heavy
  clients: 8
  rate_per_second: 20
  accounts: 32
  exclusive_accounts: true
  client_mix: {polite: 1.0}
faults:
  - id: divergences
    kind: partner
    modes: {double_process: 0.05, webhook_drop: 0.2}
  # The worker ahead takes a live lease from the one behind a second after it
  # was taken, but once it holds the lease the one behind sees it valid for
  # the TTL plus the skew, past the next renewal: it keeps the lease.
  - id: worker-ahead
    kind: clock
    targets: [bank-worker-2]
    offset: +29s
  # Restarting the worker ahead now and then hands the lease back to the one
  # behind, so the one ahead takes it again, often from a batch in flight.
  - id: restart-ahead
    kind: process
    targets: [bank-worker-2]
    schedule: {type: poisson, mean_interval: 150s}
  - id: api-behind
    kind: clock
    targets: [bank-api]
    offset: -10m
  # A reconciler holds its batch for 20 s, under the 30 s lease, so the
  # worker that runs ahead takes the lease while the batch is still unbooked:
  # two reconcilers book the same entries unless the lease follows the
  # database clock (FC35).
  - id: slow-batch
    kind: failpoint
    targets: [bank-worker-1, bank-worker-2]
    failpoint: recon.after_compute_before_apply
    action: delay
    arg: 20s
    probability: 1
