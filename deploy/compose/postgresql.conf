# Tuned for a 1 GiB host (docs/architecture.md, section 11.1).
# This file replaces the image default, so it must also set listen_addresses.
listen_addresses = '*'

shared_buffers = 64MB
effective_cache_size = 256MB
work_mem = 2MB
maintenance_work_mem = 32MB
max_connections = 40
wal_buffers = 4MB
max_wal_size = 512MB
wal_level = replica

# Durability (defense D12). Only the durability=naive scenario profile turns
# synchronous_commit off (FC30); fsync is never turned off.
synchronous_commit = on
fsync = on

# A paused or partitioned client must not hold locks forever. TCP keepalives
# alone do not help, because Toxiproxy keeps the server-side socket alive.
idle_in_transaction_session_timeout = 15s
tcp_keepalives_idle = 10
tcp_keepalives_interval = 5
tcp_keepalives_count = 3
client_connection_check_interval = 5s
