# Local lab: `./entrypoint.sh` (or `make up`) generates .env and starts
# everything. Only the panel is published, and only on localhost; chaos and
# admin ports stay on the internal network.
name: centavo

x-chaos-target: &chaos-target
  # The service runs as a child of tini, not as PID 1, so a SIGKILL sent to
  # itself (chaos-kill) really kills it and the restart policy brings it back.
  init: true
  restart: unless-stopped
  labels:
    centavo.chaos.target: "true"

x-bank-build: &bank-build
  context: ./bank
  args:
    BUILD_TAGS: chaoslab
    VERSION: ${CENTAVO_VERSION:-dev}

x-bank-env: &bank-env
  CENTAVO_ENV: chaoslab
  CENTAVO_DEFENSES: ${CENTAVO_DEFENSES:-robust}
  CENTAVO_CHAOS_TOKEN: ${CENTAVO_CHAOS_TOKEN:?run ./entrypoint.sh to generate .env}
  PARTNER_PARTICIPANT_ID: centavo-robust
  PARTNER_WEBHOOK_SECRET: ${PARTNER_WEBHOOK_SECRET:?run ./entrypoint.sh to generate .env}

x-bank-healthcheck: &bank-healthcheck
  test: ["CMD", "/app/bank", "healthcheck"]
  interval: 5s
  timeout: 4s
  retries: 12

services:
  postgres:
    <<: *chaos-target
    image: postgres:18.6
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./entrypoint.sh to generate .env}
      BANK_MIGRATOR_PASSWORD: ${BANK_MIGRATOR_PASSWORD:?run ./entrypoint.sh to generate .env}
      BANK_APP_PASSWORD: ${BANK_APP_PASSWORD:?run ./entrypoint.sh to generate .env}
      BANK_AUDITOR_PASSWORD: ${BANK_AUDITOR_PASSWORD:?run ./entrypoint.sh to generate .env}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:?run ./entrypoint.sh to generate .env}
    volumes:
      # Since image 18 the volume lives at /var/lib/postgresql, not .../data.
      - pgdata:/var/lib/postgresql
      - ./deploy/compose/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./deploy/compose/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "postgres", "--dbname", "bank_robust"]
      interval: 5s
      timeout: 4s
      retries: 12
    mem_limit: 288m

  # Replica profile: a hot standby cloned from the primary on first start,
  # streaming through Toxiproxy's replication link, where the bot adds lag. A
  # failover promotes it.
  postgres-replica:
    <<: *chaos-target
    profiles: [replica]
    image: postgres:18.6
    user: postgres
    entrypoint: ["/bin/sh", "/etc/postgresql/replica.sh"]
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:?run ./entrypoint.sh to generate .env}
    volumes:
      - pgreplica:/var/lib/postgresql
      - ./deploy/compose/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./deploy/compose/replica.sh:/etc/postgresql/replica.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "postgres"]
      interval: 5s
      timeout: 4s
      retries: 60
    mem_limit: 224m

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy/toxiproxy.json"]
    volumes:
      - ./deploy/compose/toxiproxy.json:/etc/toxiproxy/toxiproxy.json:ro
    restart: unless-stopped
    mem_limit: 48m

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    environment:
      CONTAINERS: 1
      EXEC: 1
      POST: 1
      EVENTS: 1
      # The cure starts targets that are down; nothing else is allowed.
      ALLOW_START: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    mem_limit: 32m

  bank-migrate:
    build: *bank-build
    image: centavo-bank:local-chaoslab
    command: ["migrate"]
    environment:
      <<: *bank-env
      # Migrations bypass Toxiproxy: schema changes are not a chaos target.
      DATABASE_URL: postgres://bank_migrator:${BANK_MIGRATOR_PASSWORD}@postgres:5432/bank_robust?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bank-api:
    <<: *chaos-target
    image: centavo-bank:local-chaoslab
    # Built by bank-migrate; it exists only locally, so never pull it.
    pull_policy: never
    command: ["api"]
    environment:
      <<: *bank-env
      DATABASE_URL: postgres://bank_app:${BANK_APP_PASSWORD}@toxiproxy:15432/bank_robust?sslmode=disable
      CENTAVO_INSTANCE: bank-api
      GOMEMLIMIT: 64MiB
    volumes:
      - lab-events:/lab/events
    depends_on:
      bank-migrate:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_started
    healthcheck: *bank-healthcheck
    mem_limit: 96m

  bank-worker-1:
    <<: *chaos-target
    image: centavo-bank:local-chaoslab
    # Built by bank-migrate; it exists only locally, so never pull it.
    pull_policy: never
    command: ["worker"]
    environment:
      <<: *bank-env
      DATABASE_URL: postgres://bank_app:${BANK_APP_PASSWORD}@toxiproxy:15433/bank_robust?sslmode=disable
      PARTNER_BASE_URL: http://toxiproxy:18081
      CENTAVO_INSTANCE: bank-worker-1
      GOMEMLIMIT: 56MiB
    volumes:
      - lab-events:/lab/events
    depends_on:
      bank-migrate:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_started
    healthcheck: *bank-healthcheck
    mem_limit: 80m

  bank-worker-2:
    <<: *chaos-target
    image: centavo-bank:local-chaoslab
    # Built by bank-migrate; it exists only locally, so never pull it.
    pull_policy: never
    command: ["worker"]
    environment:
      <<: *bank-env
      DATABASE_URL: postgres://bank_app:${BANK_APP_PASSWORD}@toxiproxy:15434/bank_robust?sslmode=disable
      PARTNER_BASE_URL: http://toxiproxy:18082
      CENTAVO_INSTANCE: bank-worker-2
      GOMEMLIMIT: 56MiB
    volumes:
      - lab-events:/lab/events
    depends_on:
      bank-migrate:
        condition: service_completed_successfully
      toxiproxy:
        condition: service_started
    healthcheck: *bank-healthcheck
    mem_limit: 80m

  partner:
    <<: *chaos-target
    build:
      context: ./partner
      args:
        BUILD_TAGS: chaoslab
        VERSION: ${CENTAVO_VERSION:-dev}
    image: centavo-partner:local-chaoslab
    command: ["serve"]
    environment:
      CENTAVO_ENV: chaoslab
      CENTAVO_CHAOS_TOKEN: ${CENTAVO_CHAOS_TOKEN:?run ./entrypoint.sh to generate .env}
      PARTNER_DB_PATH: /data/truth.db
      # Webhooks go back through Toxiproxy, so network chaos reaches them too.
      PARTNER_PARTICIPANTS: centavo-robust=http://toxiproxy:18080/webhooks/partner
      PARTNER_WEBHOOK_SECRET: ${PARTNER_WEBHOOK_SECRET:?run ./entrypoint.sh to generate .env}
      GOMEMLIMIT: 56MiB
    volumes:
      # The truth lives apart from the bank's PostgreSQL.
      - partner-data:/data
    healthcheck:
      test: ["CMD", "/app/partner", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 12
    mem_limit: 80m

  lab:
    build:
      context: ./lab
      args:
        VERSION: ${CENTAVO_VERSION:-dev}
    image: centavo-lab:local
    command: ["serve"]
    environment:
      # The load generator reaches the bank through Toxiproxy, like any client.
      BANK_API_URL: http://toxiproxy:28080
      # Control calls of the cure (resolve) skip Toxiproxy: they run after it.
      BANK_CONTROL_URL: http://bank-api:8080
      ARTIFACT_STORE: file:///data/rounds
      # The auditor and the exporter read the ledger read-only through
      # auditor_pg, a link the bot never puts toxics on: it only follows the
      # database when a failover moves it.
      AUDITOR_DATABASE_URL: postgres://bank_auditor:${BANK_AUDITOR_PASSWORD}@toxiproxy:15435/bank_robust?sslmode=disable
      CENTAVO_CHAOS_TOKEN: ${CENTAVO_CHAOS_TOKEN:?run ./entrypoint.sh to generate .env}
      # The bot reaches Docker only through docker-proxy.
      DOCKER_HOST: tcp://docker-proxy:2375
      CENTAVO_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-centavo}
      PARTNER_ADMIN_URL: http://partner:9092
      PARTNER_PARTICIPANT_ID: centavo-robust
    volumes:
      - lab-data:/data
      - lab-events:/lab/events
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "/app/lab", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped
    # 160 MiB for the lab plus 256 MiB for the checker, which runs as its
    # subprocess between rounds, in this same cgroup.
    mem_limit: 416m

networks:
  default:
    driver_opts:
      # Fixed name, used by the FIS latency experiment.
      com.docker.network.bridge.name: br-centavo

volumes:
  pgdata: {}
  pgreplica: {}
  lab-data: {}
  lab-events: {}
  partner-data: {}
